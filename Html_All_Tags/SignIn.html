<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <div class="mainform">
            <div class="form-box loginbox">
            <h1>Sign In</h1>
            <p class="subtitle">Sign in to your account</p>
            <form id="loginform">
                <div class="form1">
                <label for="loginemail">Email:</label>
                <input type="email" id="loginemail" placeholder="Enter your email">
                <small id="loginemailerror"></small></div>  
                <div class="form1">
                <label for="loginpassword">Password:</label>
                <input type="password" id="loginpassword" placeholder="Enter your password">
                <small id="loginpassworderror"></small></div>
                <div class="mainbtn">
                <button type="submit" class="btn1">Sign In</button>
                    <button type="reset" class="btn1">Reset</button>
                    </div>
                <p class="bottomtext">Don't have an account? <a href="SignUp.html" target="_blank">Sign Up</a></p>
            </form>
        </div>
        </div>
</body>
</html>
